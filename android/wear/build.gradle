apply plugin: 'com.android.application'

// Wear OS companion. Same applicationId and signing key as the phone app,
// which the Wearable Data Layer requires for the two to talk.
def ksFile = rootProject.file('../keys/keystore.properties')

android {
    namespace = "com.overload.gym.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.overload.gym"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 100008
        versionName "2.1.0"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                def ks = new Properties()
                ks.load(new FileInputStream(ksFile))
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (ksFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
}
